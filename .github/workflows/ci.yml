name: CI

# Note: this does not gate the GitHub Pages deploy. Pages publishes master from
# the branch-and-path setting on the repository, with no workflow involved, so
# a push to master redeploys the demo whether or not this run is green. The
# demo pages also load src/ directly as native ES modules rather than the
# bundle, so nothing here exercises them -- check test/index.html and
# test/playback.html by hand before merging anything that touches src/.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what development happens
        # on. Running both catches accidental reliance on newer node's ESM
        # syntax detection, which would otherwise only show up for consumers.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci requires package-lock.json to be in step with package.json, so
      # any commit changing dependencies has to regenerate the lock in the same
      # commit or this fails on that commit alone.
      # npm ci runs the "prepare" script, so dist/ is built here before the
      # test step -- which matters, because test/dist.test.js loads the bundle.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  # There was a dist-freshness job here, comparing the committed bundle against
  # a fresh build. It went when dist/ stopped being committed: there is no
  # longer a stored copy that can drift out of date. test/dist.test.js is what
  # guards the bundle now, and it does so on every run rather than only on
  # pull_request.
  pack:
    # The packaging failures that matter are invisible to the specs above,
    # because those import src/ directly. Only an installed tarball exercises
    # the "exports" map, the "files" allowlist and the published declarations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack and install into a throwaway project
        run: |
          set -euo pipefail
          tarball="$PWD/$(npm pack --silent)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$tarball" >/dev/null
          node -e '
            const e = require("@vagdur/exsurge");
            if (Object.keys(e).length !== 139) throw new Error("CJS: wrong export count");
            if (typeof e.ChantContext !== "function") throw new Error("CJS: no ChantContext");
          '
          node --input-type=module -e '
            import * as e from "@vagdur/exsurge";
            if (typeof e.ChantContext !== "function") {
              throw new Error("ESM: named exports missing -- check the exports map");
            }
          '
          node -e 'require.resolve("@vagdur/exsurge/assets/fonts/ExsurgeChar.otf")'
