name: CI

# Note: this does not gate the GitHub Pages deploy. Pages publishes master from
# the branch-and-path setting on the repository, with no workflow involved, so
# a push to master redeploys the demo whether or not this run is green. The
# demo pages also load src/ directly as native ES modules rather than the
# bundle, so nothing here exercises them -- check test/index.html and
# test/playback.html by hand before merging anything that touches src/.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Lint, format and typecheck do not vary with the Node version under test, so
  # they run once rather than once per matrix entry.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # npm ci requires package-lock.json to be in step with package.json, so
      # any commit changing dependencies has to regenerate the lock in the same
      # commit or this fails on that commit alone.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # Runtime suite on the engines floor and on the Node version development
  # happens on. Running both catches accidental reliance on newer node's ESM
  # syntax detection, which would otherwise only show up for consumers.
  # npm ci runs the "prepare" script, so dist/ is built before npm test —
  # which matters, because test/dist.test.js loads the bundle.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Packaging failures are invisible to the specs above, because those import
  # src/ directly. scripts/pack-smoke.mjs packs, installs into a throwaway
  # project, and checks that CJS/ESM resolve through the exports map with the
  # same named surface (no hardcoded export count) and that assets ship.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:pack
